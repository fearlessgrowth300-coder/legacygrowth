          {
            "@type": "Question",
            "name": "What does a digital product marketing service include?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A digital product marketing service builds everything you need to sell an online product: a conversion-optimized sales funnel, product positioning and messaging, landing pages, checkout setup, and a launch strategy. At Legacy Falcon Marketing this is done-for-you — you bring the product or course idea, and you receive a complete, ready-to-sell system."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need technical skills to work with you?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No technical skills required. I handle 100% of the technical setup including coding, design, and platform configuration. You'll receive a fully-functional, ready-to-use system with simple step-by-step instructions for managing your content. Perfect for non-tech-savvy marketers who want professional results."
            }
          },
          {
            "@type": "Question",
            "name": "How fast can I start seeing sales after setup?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most clients see their first sales within 7-14 days. Many achieve their first overnight sales within 48 hours of going live. Results depend on your niche selection, existing audience size, and promotional efforts. I provide a realistic timeline and launch strategy tailored to your specific situation during our initial consultation."
            }
          },
          {
            "@type": "Question",
            "name": "How do I know this isn't a scam?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "I understand your concern - the digital marketing space has many bad actors. Here's what makes Legacy Falcon Marketing different: 100+ verified client testimonials with real dollar amounts and screenshots, transparent pricing (no hidden fees or upsells), 30-day money-back guarantee on setup quality, portfolio of live client stores you can review, and direct client references available upon request. You're protected every step of the way."
            }
          },
          {
            "@type": "Question",
            "name": "Do you offer refunds or guarantees?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "I stand behind my work 100%. If I set up your store and you're not satisfied with the quality of the setup itself, I'll make it right or provide a full refund within 7 days. However, I cannot guarantee specific sales results as that depends on multiple factors including your effort in promoting the store."
            }
          },
          {
            "@type": "Question",
            "name": "What if I already have a store that's not working?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Perfect! I specialize in fixing and optimizing existing stores. I'll audit your current setup, identify what's not working, and implement proven strategies to get you sales. Many of my best success stories are from rescuing 'dead' stores."
            }
          },
          {
            "@type": "Question",
            "name": "How much does a done-for-you sales funnel cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A done-for-you sales funnel from Legacy Falcon Marketing costs between $97 for a basic setup and $497 for a complete system with automation. The exact investment depends on what you need. Message me on WhatsApp for a personalized quote based on your situation."
            }
          },
          {
            "@type": "Question",
            "name": "What support do I get after setup?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You get 30 days of direct WhatsApp support after your setup is complete. I'll help you troubleshoot issues, optimize your store, and answer any questions. After that, ongoing support packages are available if you want continued guidance."
            }
          },
          {
            "@type": "Question",
            "name": "Can you guarantee I'll make money?",
            "acceptedAnswer": {
              "@type": "Answer",

            }
          }
